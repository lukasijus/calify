name: Deploy Calify main preview

on:
  push:
    branches: [main]

# Only pushes to main run this. Do not add pull_request triggers: the job runs
# on a self-hosted runner and this repo is public.
permissions:
  contents: read

concurrency:
  group: calify-main-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Start the database
        run: docker compose -f compose.yaml up -d --wait db

      - name: Build and restart Calify main
        run: docker compose -f compose.yaml up -d --build --force-recreate --no-deps calify

      - name: Reload shared gateway for the new container IP
        run: |
          # nginx -t validates the whole gateway config, including the preview
          # routes in previews.conf which this deploy does not own. An unrelated
          # stale preview upstream must not fail the main deploy — the Verify
          # step below is the real gate on whether /calify is being served.
          if docker exec jetson-app-gateway nginx -t; then
            docker exec jetson-app-gateway nginx -s reload
          else
            echo "::warning::gateway nginx -t failed (likely an unrelated preview route); skipping reload"
          fi

      - name: Verify Calify main preview
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8092/calify >/dev/null; then
              break
            fi
            if test "$attempt" = 30; then
              docker compose -f compose.yaml logs --no-color --tail=100 calify db
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8092/calify/api/weights | grep -q '"entries"'; then
              break
            fi
            if test "$attempt" = 30; then
              docker compose -f compose.yaml logs --no-color --tail=100 calify db
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --insecure \
            https://jetson.tail68fd31.ts.net/calify >/dev/null
          echo "Main preview deployed from $(git rev-parse HEAD)"
